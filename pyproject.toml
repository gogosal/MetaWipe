[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metawipe-local"
version = "3.0.1"
description = "Local image metadata inspection and cleaning, without recompression."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow==12.3.0"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.11.2"]
dev = ["PySide6-Essentials==6.11.2", "build>=1,<2"]

[project.scripts]
metawipe = "metawipe.cli:main"
pixelguard = "metawipe.cli:main"

[project.gui-scripts]
metawipe-gui = "metawipe.cli:run_gui"

[tool.setuptools.packages.find]
include = ["metawipe*", "pixelguard*"]
